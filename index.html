<div id="player-count">
Loading players...
</div>

<script>
fetch("trapz.crystalgodgamer.workers.dev")
  .then(response => response.json())
  .then(data => {
    if (data.online) {
      document.getElementById("player-count").innerHTML =
        `🟢 ${data.players}/${data.max} Players Online`;
    } else {
      document.getElementById("player-count").innerHTML =
        "🔴 Server Offline";
    }
  });
</script>
